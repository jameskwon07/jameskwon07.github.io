<body>
  <script>
    // 화수별 URL 맵
    var episodes = {
      "1":  "https://codingbridge.blog/2026/02/22/llm-radar-build-1/",
      "2":  "https://codingbridge.blog/2026/02/23/llm-radar-build-2/",
      "3":  "https://codingbridge.blog/2026/02/25/llm-radar-build-3/",
      "4":  "https://codingbridge.blog/2026/02/28/llm-radar-build-4/",
      "5":  "https://codingbridge.blog/2026/03/01/llm-radar-build-5/",
      "6":  "https://codingbridge.blog/2026/03/02/llm-radar-build-6/",
      "7":  "https://codingbridge.blog/2026/03/06/llm-radar-build-7/",
      "8":  "https://codingbridge.blog/2026/03/07/llm-radar-build-8/",
      "9":  "https://codingbridge.blog/2026/03/08/llm-radar-build-9/",
      "10": "https://codingbridge.blog/2026/03/15/llm-radar-build-10/",
      "11": "https://codingbridge.blog/2026/03/17/llm-radar-build-11/",
      "12": "https://codingbridge.blog/2026/03/21/llm-radar-build-12/",
      "13": "https://codingbridge.blog/2026/03/22/llm-radar-build-13/",
      "14": "https://codingbridge.blog/2026/03/26/llm-radar-build-14/",
    };
    var latest = "14";

    // ep 파라미터 파싱
    var params = new URLSearchParams(window.location.search);
    var ep = params.get("ep");
    var target = episodes[ep] || episodes[latest];

    // 출처 저장
    try {
      sessionStorage.setItem('ref_source', 'disquiet');
      sessionStorage.setItem('ref_medium', 'referral');
      sessionStorage.setItem('ref_campaign', 'log');
      if (ep) sessionStorage.setItem('ref_episode', ep);
    } catch(e) {}

    window.location.replace(target);
  </script>
</body>
