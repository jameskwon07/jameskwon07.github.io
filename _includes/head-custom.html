<!-- JSON-LD 구조화 데이터 — AI 검색 최적화 -->
{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "url": "https://codingbridge.blog"
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "url": "https://codingbridge.blog"
  },
  "url": "https://codingbridge.blog{{ page.url }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://codingbridge.blog{{ page.url }}"
  },
  "keywords": {{ page.tags | join: ", " | jsonify }},
  "inLanguage": "ko"
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | jsonify }},
  "url": "https://codingbridge.blog",
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "url": "https://codingbridge.blog"
  },
  "inLanguage": "ko"
}
</script>
{% endif %}

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S9LDR2M8EK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S9LDR2M8EK');
  gtag('config', 'G-L8X793D76H');

  // /from/* 리다이렉트 출처 추적 (UTM URL 노출 없이)
  try {
    var refSource   = sessionStorage.getItem('ref_source');
    var refMedium   = sessionStorage.getItem('ref_medium');
    var refCampaign = sessionStorage.getItem('ref_campaign');
    if (refSource) {
      gtag('event', 'referral_visit', {
        source:   refSource,
        medium:   refMedium,
        campaign: refCampaign,
        page:     location.pathname
      });
      sessionStorage.removeItem('ref_source');
      sessionStorage.removeItem('ref_medium');
      sessionStorage.removeItem('ref_campaign');
    }
  } catch(e) {}
</script>
